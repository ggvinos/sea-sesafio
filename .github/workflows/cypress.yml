name: cypress

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cypress-io/github-action@v6
        with:
          browser: chrome
          command: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-evidencias
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
